<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>
body{
    margin:0;
    background:#050b16;
    color:#00e5ff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
}

.ring{
    width:220px;
    height:220px;
    border:5px solid #00e5ff;
    border-radius:50%;
    box-shadow:0 0 20px #00e5ff,
               0 0 50px #00e5ff;
    animation:pulse 2s infinite;
    margin:auto;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

h1{
    margin-top:30px;
    font-size:42px;
    letter-spacing:8px;
}

#status{
    font-size:22px;
    margin-top:10px;
}

#clock{
    font-size:32px;
    margin:20px;
}

button{
    background:#00e5ff;
    color:black;
    border:none;
    padding:15px 40px;
    border-radius:40px;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="ring"></div>

<h1>J.A.R.V.I.S.</h1>

<div id="status">ONLINE</div>

<div id="clock"></div>

<button onclick="activate()">ACTIVATE</button>

</div>

<script>

function updateClock(){
let now=new Date();

document.getElementById("clock").innerHTML=
now.toLocaleTimeString();
}

setInterval(updateClock,1000);

updateClock();

function activate(){

document.getElementById("status").innerHTML="LISTENING...";

let msg=new SpeechSynthesisUtterance(
"Hello Sir. Jarvis online."
);

speechSynthesis.speak(msg);

setTimeout(function(){
document.getElementById("status").innerHTML="ONLINE";
},4000);

}

</script>

</body>
</html>
